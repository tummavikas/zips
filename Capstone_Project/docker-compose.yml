services:
  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/advisor.sqlite3
      MODEL_PATH: /app/models/eligibility.joblib
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    ports:
      - "8000:8000"

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8501:8501"
